services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: inventory_system_app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/appuser
      - NPM_CONFIG_CACHE=/home/appuser/.npm
      - COMPOSER_HOME=/home/appuser/.composer
    ports:
      - "8000:8000"
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./src:/app
    networks:
      - inventory_network
    depends_on:
      - db
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: inventory_system_app
  #   user: "${UID:-1000}:${GID:-1000}"
  #   ports:
  #     - "8000:8000"
  #     - "5173:5173" # Vite / HMR
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./src:/app
  #   networks:
  #     - inventory_network
  #   depends_on:
  #     - db
    # command: tail -f /dev/null  # descomenta para entrar manualmente sin levantar servicios

  db:
    image: mysql:8.0
    container_name: inventory_system_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inventory_network

  adminer:
    image: adminer
    container_name: inventory_system_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge

volumes:
  db_data:

